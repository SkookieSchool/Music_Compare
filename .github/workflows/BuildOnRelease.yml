name: Build release applications

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            data_separator: ";"
          - os: macos-13
            platform: macos
            data_separator: ":"
          - os: ubuntu-24.04
            platform: linux
            data_separator: ":"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name Music_Compare \
            --add-data "UI/sealquestionmark.png${{ matrix.data_separator }}." \
            --add-data "UI/Seal_noises_fixed.wav${{ matrix.data_separator }}." \
            Music_Compare_GUI_V2.py

      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir release
          7z a "release/Music_Compare-windows.zip" "dist/Music_Compare.exe"

      - name: Package macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir release
          zip -r "release/Music_Compare-macos.zip" "dist/Music_Compare.app"

      - name: Package Linux application
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release/Music_Compare-linux
          cp dist/Music_Compare release/Music_Compare-linux/
          cat > release/Music_Compare-linux/Music_Compare.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$SCRIPT_DIR/Music_Compare" "$@"
          EOF
          chmod +x release/Music_Compare-linux/Music_Compare.sh
          tar -czf release/Music_Compare-linux.tar.gz \
            -C release Music_Compare-linux
          cp release/Music_Compare-linux/Music_Compare.sh \
            release/Music_Compare-linux.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: release/*
          if-no-files-found: error

  publish:
    name: Attach applications to release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
